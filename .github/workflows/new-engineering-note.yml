name: New Engineering Note

on:
  workflow_dispatch:
    inputs:
      date:
        description: "날짜 (YYYY-MM-DD)"
        required: true
        type: string
      title:
        description: "제목"
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-note:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create note
        shell: bash
        run: |
          set -e

          DATE="${{ inputs.date }}"
          TITLE="${{ inputs.title }}"

          # 날짜 형식 확인
          if [[ ! "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Error: 날짜는 YYYY-MM-DD 형식이어야 합니다."
            exit 1
          fi

          # 날짜에서 연도 추출
          YEAR="${DATE:0:4}"

          # 제목을 파일명으로 변환
          FILENAME=$(echo "$TITLE" | sed 's/ /-/g')
          FILE="$YEAR/SSRC/${DATE}-${FILENAME}.md"

          # 저장 폴더 생성
          mkdir -p "$YEAR/SSRC"

          # 동일한 파일이 이미 존재하는지 확인
          if [ -f "$FILE" ]; then
            echo "Error: 해당 노트가 이미 존재합니다: $FILE"
            exit 1
          fi

          # 템플릿 복사
          cp templates/engineering-note.md "$FILE"

          # 날짜와 제목 적용
          sed -i "s/YYYY-MM-DD/$DATE/g" "$FILE"
          sed -i "s/^# Engineering Note/# $TITLE/" "$FILE"

          echo "Created: $FILE"

      - name: Commit and push
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add 2026/SSRC/ 2027/SSRC/ 2>/dev/null || true

          # 실제 변경 파일도 추가
          git add .
          
          if git diff --cached --quiet; then
            echo "변경 사항이 없습니다."
            exit 1
          fi

          git commit -m "Add SSRC engineering note"
          git push
