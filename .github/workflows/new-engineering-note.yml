name: New Engineering Note

on:
  workflow_dispatch:
    inputs:
      date:
        description: "날짜 (YYYY-MM-DD)"
        required: true
        type: string
      title:
        description: "제목"
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-note:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create note
        run: |
          DATE="${{ inputs.date }}"
          TITLE="${{ inputs.title }}"

          YEAR="${DATE:0:4}"
          FILENAME=$(echo "$TITLE" | sed 's/ /-/g')
          FILE="$YEAR/${DATE}-${FILENAME}.md"

          mkdir -p "$YEAR"

          cp templates/engineering-note.md "$FILE"

          sed -i "s/YYYY-MM-DD/$DATE/g" "$FILE"
          sed -i "s/^# Engineering Note/# $TITLE/" "$FILE"

          echo "Created: $FILE"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "Add engineering note"
          git push
